name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) — no token secret needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node 24 ships npm 11.5+ (required for trusted publishing)
          node-version: 24
          cache: npm
          # no registry-url here: it would write a token into .npmrc and
          # shadow the OIDC credential npm obtains during publish
      - name: Sync version from release tag
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - run: npm ci
      - run: npm test
      # provenance disabled while the repo is private: npm rejects attestations
      # from non-public source repos. Restore NPM_CONFIG_PROVENANCE: true once public.
      - run: npm publish
